[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st123"
description = "Space-telescope imaging toolkit for HST, JWST, and Roman: MAST download, JHAT alignment, mosaicking, and DOLPHOT helpers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Charlie Kilpatrick" },
    { name = "Aswin Suresh" },
]
keywords = [
    "astronomy",
    "space-telescope",
    "hst",
    "jwst",
    "roman",
    "nircam",
    "miri",
    "wfc3",
    "acs",
    "mast",
    "photometry",
    "dolphot",
    "jhat",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Version from git tags via setuptools-scm; runtime deps from requirements.txt.
dynamic = ["version", "dependencies"]

# Scope: generalized space-telescope tooling (HST, JWST, Roman), not JWST-only.
# Provenance: new repository (not a GitHub fork) descending from
# charliekilpatrick/hst123 and aswinsuresh24/jwst123 (dev-cdk snapshot).
# See README.md "Provenance" and the URLs below.

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "pytest>=8.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.2",
    "numpydoc>=1.5",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/charliekilpatrick/st123"
Repository = "https://github.com/charliekilpatrick/st123"
Documentation = "https://charliekilpatrick.github.io/st123/"
"Provenance (hst123)" = "https://github.com/charliekilpatrick/hst123"
"Provenance (jwst123)" = "https://github.com/aswinsuresh24/jwst123"

# Console entry points live under st123.scripts (library code stays in st123.*).
[project.scripts]
download = "st123.scripts.download:main"
align = "st123.scripts.align:main"
mosaic = "st123.scripts.mosaic:main"
link-raw = "st123.scripts.link_raw:main"
image-overlap = "st123.scripts.image_overlap:main"
region = "st123.scripts.region:main"
catalog = "st123.scripts.catalog:main"
dolphot-prep = "st123.scripts.dolphot:main"
run-dolphot = "st123.scripts.run_dolphot:main"
dolphot-hdf5 = "st123.scripts.dolphot_hdf5:main"
dolphot-warmstart-prep = "st123.scripts.dolphot_warmstart:main"
dolphot-warmstart = "st123.scripts.dolphot_warmstart:main"
coadd-phot = "st123.scripts.coadd_phot:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Dynamic version from git tags (e.g. v0.1.0 → 0.1.0).
# Between tags: 0.1.1.devN+gHASH (guess-next-dev). See README "Versioning".
[tool.setuptools_scm]
version_file = "st123/_version.py"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
include = ["st123*"]
exclude = ["st123.notebooks*"]

[tool.setuptools.package-data]
st123 = [
    "notebooks/*.ipynb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
