name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    name: Build and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm can resolve the package version.
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: st123
          auto-activate-base: false

      - name: Install system libraries for tables / drizzlepac
        run: |
          conda install -y -c conda-forge hdf5 blosc pytables

      - name: Install package (editable) with test extras
        run: |
          python -m pip install --upgrade pip
          # Custom JHAT comes from requirements.txt (jhat @ file:./extdeps/jhat).
          python -m pip install -e ".[dev]"

      - name: Verify console scripts
        run: |
          download --help
          align --help
          mosaic --help
          link-raw --help
          image-overlap --help
          region --help
          catalog --help

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
